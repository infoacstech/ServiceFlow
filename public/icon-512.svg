<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#070C1E" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <radialGradient id="centerAura512" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldBorderGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="shieldInnerGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2356" />
      <stop offset="60%" stop-color="#0A183D" />
      <stop offset="100%" stop-color="#060F26" />
    </linearGradient>

    <linearGradient id="arrowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <radialGradient id="orbGrad512" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="35%" stop-color="#00D2FF" />
      <stop offset="75%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <filter id="neonGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shieldShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00B4D8" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad512)" />
  <rect width="512" height="512" rx="115" fill="none" stroke="#1E293B" stroke-width="2" />
  <circle cx="256" cy="256" r="230" fill="url(#centerAura512)" />

  <g filter="url(#shieldShadow512)">
    <path 
      d="M 256 68 
         L 394 134 C 402 138 406 146 406 155 
         L 406 280 
         C 406 345 342 405 260 450 
         C 257.5 451.4 254.5 451.4 252 450 
         C 170 405 106 345 106 280 
         L 106 155 
         C 106 146 110 138 118 134 
         Z" 
      fill="url(#shieldInnerGrad512)" 
      stroke="url(#shieldBorderGrad512)" 
      stroke-width="20" 
      stroke-linejoin="round"
    />

    <path 
      d="M 256 94 
         L 376 151 
         L 376 272 
         C 376 325 320 376 256 416 
         C 192 376 136 325 136 272 
         L 136 151 
         Z" 
      fill="none" 
      stroke="#00D2FF" 
      stroke-width="3" 
      stroke-opacity="0.35" 
      stroke-linejoin="round"
    />
  </g>

  <g filter="url(#neonGlow512)">
    <path 
      d="M 212 168 
         C 222 158 238 158 248 168 
         L 316 236 
         C 327 247 327 265 316 276 
         L 248 344 
         C 238 354 222 354 212 344 
         C 202 334 202 318 212 308 
         L 264 256 
         L 212 204 
         C 202 194 202 178 212 168 
         Z" 
      fill="url(#arrowGrad512)" 
    />
  </g>

  <g filter="url(#neonGlow512)">
    <circle cx="256" cy="256" r="32" fill="url(#orbGrad512)" />
    <ellipse cx="247" cy="245" rx="9" ry="6" fill="#FFFFFF" fill-opacity="0.85" transform="rotate(-30 247 245)" />
    <circle cx="256" cy="256" r="33" fill="none" stroke="#E0F2FE" stroke-width="2" stroke-opacity="0.7" />
  </g>
</svg>
