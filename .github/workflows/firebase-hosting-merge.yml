# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install && bun run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVICEFLOW_969F5 }}'
          channelId: live
          projectId: serviceflow-969f5
      - name: Deploy Firestore Rules
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVICEFLOW_969F5 }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > /tmp/firebase-sa.json
            GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json npx -y firebase-tools deploy --only firestore:rules --project serviceflow-969f5 --non-interactive
            rm -f /tmp/firebase-sa.json
          fi
